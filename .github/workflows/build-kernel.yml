name: picasso XNU (Redmi K30 5G)

# Self-contained device-repo build, mirroring the Sun_SM8750 (OnePlus 13T) workflow.
# The repo's own ./unixnu wrapper clones the pinned upstream UniXNU revision
# (upstream.rev), applies patches/unixnu-source-kernel.patch, and execs the real
# unixnu. The kernel step needs macOS (xcodebuild + iPhoneOS SDK + MIG).
#
#   build kernel payload   bootstrap (compile records + prelinked candidate), then
#                          the first-console kernel and the FAT payload (kernel +
#                          ADT + unixnu.toml), ready for bootimg.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picasso-xnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - name: Check out the picasso configuration
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the isolated UniXNU source
        run: |
          TREE=$(./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"

      - name: Install host tools and check the SDK
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          df -h .

      - name: Fetch the kernel sources and build the kernel + payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./unixnu defconfig picasso_defconfig
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily
          ./unixnu build kernel payload -j 3 2>&1 | tee out/picasso/logs/actions-build.log

      - name: Upload the kernel, payload and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-xnu-${{ github.run_number }}
          path: |
            device/out/picasso/kernel/**
            device/out/picasso/payload/**
            device/out/picasso/logs/**
            device/out/picasso/unixnu.lock
          if-no-files-found: warn
          retention-days: 7
