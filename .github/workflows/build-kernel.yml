name: picasso XNU kernel

# Self-contained device-repo build. The repo's own ./unixnu wrapper clones the pinned
# upstream UniXNU revision (upstream.rev), applies patches/unixnu-source-kernel.patch,
# and execs the real build driver. The kernel step needs macOS (xcodebuild + iPhoneOS
# SDK + MIG).
#
#   build kernel payload   bootstrap (compile records + prelinked candidate), then the
#                          first-console kernel and the FAT payload (kernel + ADT +
#                          unixnu.toml), ready for bootimg.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picasso-xnu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - name: Check out the picasso configuration
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the isolated upstream source
        run: |
          TREE=$(python3 ./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"

      - name: Install host tools and check the SDK
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          df -h .

      # The python urllib range-request reader in the unixnu driver cannot resolve
      # updates.cdn-apple.com; the board.toml URL previously had a stray dot
      # (updates.cdn.apple.com) that has no DNS record. Download the
      # IPSW with curl first (which resolves it fine) and point the driver at the local
      # file via UNIXNU_IPSW, so prelink never opens a remote connection.
      # The unixnu driver's remote reader cannot resolve Apple's CDN on the runner,
      # so download the IPSW with curl and hand the driver the local path. Resolve
      # the host through DNS-over-HTTPS and pin it with --resolve as a fallback when
      # the runner DNS has no record for the CDN name.
      - name: Download the target IPSW
        run: |
          mkdir -p device/out/ipsw
          IPSW=device/out/ipsw/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
          HOST=updates.cdn-apple.com
          URL="https://$HOST/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
          if [ ! -s "$IPSW" ]; then
            if ! curl --fail --retry 3 --retry-all-errors --connect-timeout 30 -o "$IPSW" "$URL"; then
              IP=$(curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$HOST&type=A" \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['data'] for a in d.get('Answer',[]) if a['type']==1))")
              echo "runner DNS failed; pinning $HOST to $IP"
              curl --fail --retry 5 --retry-all-errors --connect-timeout 30 \
                --resolve "$HOST:443:$IP" -o "$IPSW" "$URL"
            fi
          fi
          ls -lh "$IPSW"
          echo "UNIXNU_IPSW=$PWD/$IPSW" >> "$GITHUB_ENV"

      - name: Fetch the kernel sources and build the kernel + payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The platform seed is not stored in the repository. CI uses this fixed
          # non-unique seed; for a real device boot, rebuild the payload locally
          # with a random --unique-chip-id.
          UNIXNU_UNIQUE_CHIP_ID: "41a551c0dec0de01"
        run: |
          python3 ./unixnu defconfig picasso_defconfig
          python3 ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily
          mkdir -p out/picasso/logs
          python3 ./unixnu build kernel payload -j 3 2>&1 | tee out/picasso/logs/actions-build.log

      - name: Upload the kernel, payload and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-xnu-${{ github.run_number }}
          path: |
            device/out/picasso/kernel/**
            device/out/picasso/payload/**
            device/out/picasso/logs/**
            device/out/picasso/unixnu.lock
          if-no-files-found: warn
          retention-days: 7
