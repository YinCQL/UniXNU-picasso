name: Compose Boot Image (FD + kernel + payload)

# Composes a flashable boot image from:
#   - the firmware volume committed in uefi/SILICIUM_UEFI.fd (built by the
#     Mu-Silicium "Build and upload picasso FD" workflow, copied here manually)
#   - the XNU kernel + ADT payload built here (macOS, xcodebuild)
#   - BootShim / mkbootimg / DTB / FD config from uefi/mu-silicium (committed here)
#
# Produces boot.img ready for "fastboot boot" (or "fastboot flash boot" when the
# payload is sized to fit the boot partition).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picasso-bootimg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - name: Check out the picasso device repo (test branch, carries uefi/)
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check iPhone X migration readiness
        run: |
          python3 scripts/check-picasso-target.py --require-build-ready \
            --output out/picasso/logs/target-readiness.json --github-env "$GITHUB_ENV"

      - name: Check generated picasso ADT timer binding
        run: python3 scripts/check-picasso-adt.py --output out/picasso/logs/adt-host-check

      - name: Verify firmware volume and DTB are present
        run: |
          test -s uefi/SILICIUM_UEFI.fd || { echo "uefi/SILICIUM_UEFI.fd missing"; exit 1; }
          test -s uefi/mu-silicium/Resources/DTBs/picasso.dtb || { echo "picasso.dtb missing"; exit 1; }
          test -s uefi/mu-silicium/BootShim/BootShim.S || { echo "BootShim.S missing"; exit 1; }
          test -s uefi/mu-silicium/Resources/Scripts/mkbootimg.py || { echo "mkbootimg.py missing"; exit 1; }
          ls -l uefi/SILICIUM_UEFI.fd uefi/mu-silicium/Resources/DTBs/picasso.dtb

      - name: Prepare the isolated upstream source
        run: |
          TREE=$(python3 ./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"

      - name: Check packed Data format and seed validation
        run: |
          # Fixtures contain intentional symlinks. Upload only the result JSON.
          python3 scripts/check-picasso-ram-data.py --output out/picasso/host-checks/data \
            --packer "$UNIXNU_TREE/drivers/DarwinBoot/Test/packed_ramdisk.py"
          mkdir -p out/picasso/logs
          cp out/picasso/host-checks/data/results.json out/picasso/logs/data-host-check.json

      - name: Check ephemeral keystore state boundaries
        run: |
          python3 scripts/check-picasso-keystore.py --output out/picasso/host-checks/keystore
          cp out/picasso/host-checks/keystore/results.json out/picasso/logs/keystore-host-check.json

      - name: Install host tools and check the SDK
        run: |
          # lld is a separate Homebrew formula now; the llvm bottle no longer
          # ships ld.lld, which the entry-probe patcher needs.
          brew install cmake ninja unifdef llvm lld mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Download the target IPSW
        run: |
          mkdir -p out/ipsw
          IPSW="out/ipsw/$PICASSO_IPSW_FILE"
          HOST=updates.cdn-apple.com
          URL="$PICASSO_IPSW_URL"
          if [ ! -s "$IPSW" ]; then
            if ! curl --fail --retry 3 --retry-all-errors --connect-timeout 30 -o "$IPSW" "$URL"; then
              IP=$(curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$HOST&type=A" \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['data'] for a in d.get('Answer',[]) if a['type']==1))")
              echo "runner DNS failed; pinning $HOST to $IP"
              curl --fail --retry 5 --retry-all-errors --connect-timeout 30 \
                --resolve "$HOST:443:$IP" -o "$IPSW" "$URL"
            fi
          fi
          python3 scripts/check-picasso-target.py --ipsw "$IPSW"
          ls -lh "$IPSW"
          echo "UNIXNU_IPSW=$PWD/$IPSW" >> "$GITHUB_ENV"

      # The original static and System trust caches are extracted from the pinned
      # IPSW here rather than committed; board.toml pins the accepted bundle hash.
      - name: Bundle the original trust caches
        run: |
          mkdir -p out/picasso/logs
          TREE=$(python3 ./unixnu --prepare)
          python3 ./unixnu ipsw fetch OS KernelCache StaticTrustCache Cryptex1,SystemTrustCache 2>&1 | tee out/picasso/logs/actions-ipsw.log
          echo "UNIXNU_KERNELCACHE=$PWD/out/ipsw/$PICASSO_IPSW_BUILD/kernelcache.decompressed" >> "$GITHUB_ENV"
          python3 scripts/prepare-original-trust.py --tree "$TREE" --inputs "out/ipsw/$PICASSO_IPSW_BUILD" --output out/picasso/original-static-system.bundle 2>&1 | tee out/picasso/logs/actions-trust.log

      - name: Prepare volatile APFS Data from the original OS
        run: |
          python3 ./unixnu defconfig picasso_defconfig
          sudo "$(command -v python3)" scripts/prepare-picasso-ram-data.py \
            --tree "$UNIXNU_TREE" --source "out/ipsw/$PICASSO_IPSW_BUILD/$PICASSO_OS_MEMBER" \
            --output out/picasso/ram-data --config out/picasso/.config \
            2>&1 | tee out/picasso/logs/actions-ram-data.log

      - name: Build kernel + payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UNIQUE_CHIP_ID: "41a551c0dec0de01"
        run: |
          python3 ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily
          mkdir -p out/picasso/logs
          python3 ./unixnu build kernel payload -j 3 --trust-cache out/picasso/original-static-system.bundle --data-ramdisk out/picasso/ram-data/data.dbrdisk 2>&1 | tee out/picasso/logs/actions-build.log

      - name: Verify Data seed, compiled UUID and payload handoff
        run: |
          python3 scripts/check-picasso-data-artifacts.py --tree out/picasso/tree --work out/picasso \
            --output out/picasso/logs/data-artifacts.json

      - name: Check native counter microtime conversion
        run: |
          python3 scripts/check-picasso-microtime.py --xnu out/picasso/tree/.cache/xnu-work \
            --output out/picasso/host-checks/microtime
          cp out/picasso/host-checks/microtime/results.json out/picasso/logs/microtime-host-check.json

      - name: Verify software AES provider against the original class ABI
        run: |
          python3 scripts/check-picasso-aes-artifacts.py --tree out/picasso/tree --work out/picasso \
            --kernelcache "$UNIXNU_KERNELCACHE" --output out/picasso/logs/aes-artifacts.json

      - name: Verify watchdog service policy against the linked native driver
        run: |
          python3 scripts/check-picasso-watchdog-policy.py --verify \
            --kernelcache "$UNIXNU_KERNELCACHE" --candidate out/picasso/kernel/kernel.macho \
            --native-prelink-dir "$UNIXNU_TREE/kits/NativePrelink" \
            --output out/picasso/logs/watchdog-policy.json

      - name: Verify CPU GOP display against the original class ABI
        run: |
          python3 scripts/check-picasso-display-artifacts.py --tree out/picasso/tree --work out/picasso \
            --kernelcache "$UNIXNU_KERNELCACHE" --output out/picasso/logs/display-artifacts.json

      - name: Verify original Sandbox and IOSurface in the prelinked kernel
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          kernel = Path('out/picasso/kernel/kernel.macho')
          plan = json.loads(kernel.with_suffix('.json').read_text())
          if hashlib.sha256(kernel.read_bytes()).hexdigest() != plan['candidate_sha256']:
              raise SystemExit('Prelink report does not match kernel.macho')
          for component in ('com.apple.security.sandbox', 'com.apple.kext.AppleMatch', 'com.apple.iokit.IOSurface'):
              if component not in plan['components']:
                  raise SystemExit(f'Missing required original component: {component}')
              start = plan['module_entrypoints'][component]['start_va']
              if not any(e['module'] == component and e['segment'] == '__TEXT_EXEC'
                         and e['va'] <= start < e['va'] + e['size'] for e in plan['extents']):
                  raise SystemExit(f'Missing executable module entry: {component}')
              print(f'Prelink includes {component}, start={start:#x}')
          PY

      - name: Report kernel/payload sizes
        run: |
          ls -l out/picasso/kernel/kernel.macho out/picasso/payload/payload.img
          python3 - <<'EOF'
          import struct
          from pathlib import Path
          k = Path('out/picasso/kernel/kernel.macho')
          if k.is_file():
              d = k.read_bytes()
              print('kernel.macho', len(d), 'bytes')
              # Count segments and report the file size of each one.
              ncmds = struct.unpack_from('<I', d, 16)[0]
              off = 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from('<II', d, off)
                  if cmd == 0x19:
                      name = d[off+8:off+24].rstrip(b'\0').decode('latin1', 'replace')
                      vmaddr, vmsize, fileoff, filesize = struct.unpack_from('<QQQQ', d, off+24)
                      print(f'  seg {name:20s} filesize={filesize}')
                  off += size
          p = Path('out/picasso/payload/payload.img')
          if p.is_file():
              print('payload.img', p.stat().st_size, 'bytes')
          EOF

      - name: Compose boot image (BootShim + repo FD + payload as ramdisk)
        run: |
          python3 ./unixnu bootimg \
            --uefi "$GITHUB_WORKSPACE/device/uefi/mu-silicium" \
            --fd "$GITHUB_WORKSPACE/device/uefi/SILICIUM_UEFI.fd" \
            --dtb "$GITHUB_WORKSPACE/device/uefi/mu-silicium/Resources/DTBs/picasso.dtb" \
            --ramdisk "$GITHUB_WORKSPACE/device/out/picasso/payload/payload.img" \
            -o "$GITHUB_WORKSPACE/device/out/picasso/boot/boot.img" \
            2>&1 | tee out/picasso/logs/bootimg.log
          ls -lh out/picasso/boot/boot.img

      - name: Upload boot image + kernel + payload + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-bootimg-${{ github.run_number }}
          include-hidden-files: true
          path: |
            device/out/picasso/boot/**
            device/out/picasso/kernel/**
            device/out/picasso/payload/**
            device/out/picasso/logs/**
            device/out/picasso/tree/build/sheng-platform-power/*.json
            device/out/picasso/tree/build/sheng-platform-power/*.log
            device/out/picasso/tree/build/sheng-platform-power/*.o
            device/out/picasso/tree/build/sheng-platform-power/*.a
            device/out/picasso/tree/build/native-aes/*.json
            device/out/picasso/tree/build/native-aes/*.log
            device/out/picasso/tree/build/native-aes/*.o
            device/out/picasso/tree/build/native-aes/*.a
            device/out/picasso/tree/build/native-legacy-display/*.json
            device/out/picasso/tree/build/native-legacy-display/*.log
            device/out/picasso/tree/build/native-legacy-display/*.o
            device/out/picasso/tree/build/native-legacy-display/*.a
            device/out/picasso/tree/build/native-legacy-display/*.h
            device/out/picasso/tree/build/xnu/**/kern_exec.cpo.json
            device/out/picasso/tree/build/xnu/**/vfs_syscalls.cpo.json
            device/out/picasso/ram-data/*.json
            device/out/picasso/ram-data/data.dbrdisk
            device/out/picasso/.config
          if-no-files-found: warn
          retention-days: 7
