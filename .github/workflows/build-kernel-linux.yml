name: Build Picasso Kernel (Linux)

# Builds and prelinks kernel.macho from the pinned upstream and device sources.
# APFS Data preparation, UIKit libraries and boot.img composition are separate steps.

on:
  workflow_dispatch:
  push:
    branches: [test/pr17]
    paths: [.github/workflows/build-kernel-linux.yml]

permissions:
  contents: read

concurrency:
  group: picasso-linux-kernel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register_workflow:
    name: Register the Linux workflow on the test branch
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo 'Linux workflow registered. Select test/pr17 for a manual kernel build.'

  kernel_linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - name: Check out the picasso device repo
        uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the pinned upstream source
        run: |
          mkdir -p out/picasso/logs
          TREE=$(python3 ./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"
          echo "UNIXNU_TOOLCHAIN=$RUNNER_TEMP/unixnu-linux" >> "$GITHUB_ENV"
          echo "UNIXNU_LLVM_BIN=$RUNNER_TEMP/unixnu-linux/llvm/bin" >> "$GITHUB_ENV"

      - name: Install Linux host dependencies and identify the toolchain
        id: toolchain_key
        run: |
          sudo python3 "$UNIXNU_TREE/scripts/linux/setup-toolchain.py" --host-only \
            2>&1 | tee out/picasso/logs/linux-host-tools.log
          HOST_LLVM=$(llvm-config --version --bindir --libdir)
          python3 - "$UNIXNU_TREE" "$UNIXNU_TOOLCHAIN" "$HOST_LLVM" <<'PY'
          import hashlib, os, sys
          from pathlib import Path
          root = Path(sys.argv[1]) / 'scripts/linux'
          digest = hashlib.sha256()
          for value in sys.argv[2:]:
              digest.update(value.encode() + b'\0')
          for path in sorted(root.rglob('*')):
              if path.is_file() and '__pycache__' not in path.parts:
                  digest.update(path.relative_to(root).as_posix().encode() + b'\0')
                  digest.update(path.read_bytes() + b'\0')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('digest=' + digest.hexdigest() + '\n')
          PY

      - name: Restore the installed Linux Mach-O toolchain
        id: toolchain_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.UNIXNU_TOOLCHAIN }}
          key: unixnu-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ steps.toolchain_key.outputs.digest }}

      - name: Install or validate the Linux Mach-O kernel toolchain
        run: |
          sudo python3 "$UNIXNU_TREE/scripts/linux/setup-toolchain.py" "$UNIXNU_TOOLCHAIN" --package-manager none \
            2>&1 | tee out/picasso/logs/linux-toolchain.log
          echo "$UNIXNU_LLVM_BIN" >> "$GITHUB_PATH"
          test -x "$UNIXNU_LLVM_BIN/llvm-objcopy"

      - name: Save the installed toolchain before compiling the kernel
        if: steps.toolchain_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.UNIXNU_TOOLCHAIN }}
          key: ${{ steps.toolchain_cache.outputs.cache-primary-key }}

      - name: Prepare authenticated stock touch firmware
        run: |
          python3 scripts/fetch-picasso-touch-firmware.py --output out/picasso/novatek/firmware.bin
          echo "NOVATEK_TOUCH_FW=$PWD/out/picasso/novatek/firmware.bin" >> "$GITHUB_ENV"

      - name: Fetch the pinned kernelcache and check the original class ABI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ./unixnu defconfig picasso_defconfig
          python3 ./unixnu ipsw fetch KernelCache 2>&1 | tee out/picasso/logs/linux-ipsw.log
          echo "UNIXNU_KERNELCACHE=$PWD/out/ipsw/21H461/kernelcache.decompressed" >> "$GITHUB_ENV"
          python3 scripts/check-picasso-original-abi.py \
            --kernelcache out/ipsw/21H461/kernelcache.decompressed \
            --native-prelink-dir "$UNIXNU_TREE/kits/XnuPrelink" \
            --output out/picasso/logs/original-abi.json

      - name: Build and prelink the Picasso kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily
          python3 ./unixnu build kernel -j "$(nproc)" 2>&1 | tee out/picasso/logs/linux-build.log
          test -s out/picasso/kernel/kernel.macho
          sha256sum out/picasso/kernel/kernel.macho > out/picasso/kernel/SHA256SUMS

      - name: Upload the prelinked kernel and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-linux-kernel-${{ github.run_number }}
          path: |
            device/out/picasso/kernel/
            device/out/picasso/logs/
          if-no-files-found: warn
