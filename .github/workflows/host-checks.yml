name: Picasso host regressions

on:
  workflow_dispatch:
  push:
    branches: [feat/ios16, feat/ios16-gpu, feat/ios16-dsp]
    paths:
      - '.github/workflows/host-checks.yml'
      - 'scripts/**'
      - 'drivers/**'
      - 'package/**'
      - 'board.toml'
      - 'configs/**'
      - 'patches/**'
      - 'policy/**'
      - 'upstream.rev'
      - 'unixnu'

permissions:
  contents: read

concurrency:
  group: picasso-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check target inputs and boot argument budget
        run: |
          python3 scripts/check-picasso-target.py --require-build-inputs \
            --output out/picasso/logs/target-readiness.json

      # Compose performs the real iPhoneOS SDK build, codesign and exact CDHash
      # validation. Host regressions need only Linux clang and structural fixtures.
      - name: Install host compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libssl-dev

      - name: Prepare the isolated upstream source
        run: |
          TREE=$(python3 ./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"
          mkdir -p out/picasso/logs

      - name: Check Linux dependency reuse and live host verification
        run: |
          python3 scripts/check-picasso-linux-host.py --tree "$UNIXNU_TREE" --live \
            --output out/picasso/host-checks/linux-host
          cp out/picasso/host-checks/linux-host/results.json out/picasso/logs/linux-host-deps-host.json

      - name: Replay UI runtime XNU changes and check errors
        run: |
          python3 scripts/check-picasso-ui-replay.py --tree "$UNIXNU_TREE" --output out/picasso/host-checks/ui-runtime
          cp out/picasso/host-checks/ui-runtime/replay.json out/picasso/logs/ui-runtime-replay.json
          cp out/picasso/host-checks/ui-runtime/runtime/results.json out/picasso/logs/ui-runtime-host.json
          cp out/picasso/host-checks/ui-runtime/nvram/results.json out/picasso/logs/nvram-host.json
          cp out/picasso/host-checks/ui-runtime/surface/results.json out/picasso/logs/ui-surface-host.json
          cp out/picasso/host-checks/ui-runtime/startup/results.json out/picasso/logs/startup-host.json

      - name: Check exact status bar library trust
        run: |
          python3 scripts/check-picasso-ui-trust.py --output out/picasso/host-checks/ui-trust
          cp out/picasso/host-checks/ui-trust/results.json out/picasso/logs/ui-trust-host.json

      - name: Check PR13 GPU firmware and staged probe
        if: github.ref_name == 'feat/ios16-gpu' || github.ref_name == 'feat/ios16-dsp'
        run: |
          python3 scripts/check-picasso-gpu-firmware.py --output out/picasso/host-checks/gpu-firmware
          cp out/picasso/host-checks/gpu-firmware/results.json out/picasso/logs/gpu-firmware-host.json
          ADRENO620_VENDOR_DIR="$PWD/out/picasso/host-checks/gpu-firmware/firmware" \
            make -C drivers/NativeAdrenoPicasso/Test test CC=clang CXX=clang++

      - name: Check bounded DC ZVA fallback
        if: github.ref_name == 'feat/ios16-gpu' || github.ref_name == 'feat/ios16-dsp'
        run: |
          python3 scripts/check-picasso-zva.py --output out/picasso/host-checks/zva
          cp out/picasso/host-checks/zva/results.json out/picasso/logs/zva-host.json

      - name: Check ASTC decode preflight
        run: |
          python3 scripts/check-picasso-astc-guard.py --output out/picasso/host-checks/astc-guard
          cp out/picasso/host-checks/astc-guard/results.json out/picasso/logs/astc-guard-host.json

      - name: Check PR13 WLAN firmware and handshake
        if: github.ref_name == 'feat/ios16-gpu' || github.ref_name == 'feat/ios16-dsp'
        run: |
          python3 scripts/check-picasso-wlan.py --output out/picasso/host-checks/wlan
          cp out/picasso/host-checks/wlan/results.json out/picasso/logs/wlan-host.json

      - name: Check Picasso ADSP survey and firmware inputs
        if: github.ref_name == 'feat/ios16-gpu' || github.ref_name == 'feat/ios16-dsp'
        run: |
          python3 scripts/check-picasso-adsp.py --output out/picasso/host-checks/adsp
          cp out/picasso/host-checks/adsp/results.json out/picasso/logs/adsp-host.json
          python3 scripts/check-picasso-firmware.py --output out/picasso/host-checks/firmware
          cp out/picasso/host-checks/firmware/results.json out/picasso/logs/firmware-host.json
          python3 scripts/check-picasso-qmp.py --output out/picasso/host-checks/qmp
          cp out/picasso/host-checks/qmp/results.json out/picasso/logs/qmp-host.json
          python3 scripts/check-picasso-smp2p.py --output out/picasso/host-checks/smp2p
          cp out/picasso/host-checks/smp2p/results.json out/picasso/logs/smp2p-host.json
          python3 scripts/check-picasso-rpmh.py --output out/picasso/host-checks/rpmh
          cp out/picasso/host-checks/rpmh/results.json out/picasso/logs/rpmh-host.json
          python3 scripts/check-picasso-adsp-boot.py --output out/picasso/host-checks/adsp-boot
          cp out/picasso/host-checks/adsp-boot/results.json out/picasso/logs/adsp-boot-host.json

      - name: Check GOP import and completion ownership
        if: github.ref_name == 'feat/ios16-gpu' || github.ref_name == 'feat/ios16-dsp'
        run: |
          python3 scripts/check-picasso-gop-handoff.py --output out/picasso/host-checks/gop-handoff
          cp out/picasso/host-checks/gop-handoff/results.json out/picasso/logs/gop-handoff-host.json

      - name: Check generated picasso ADT timer binding
        run: python3 scripts/check-picasso-adt.py --output out/picasso/logs/adt-host-check

      - name: Check display policy against the generated ADT
        run: |
          python3 scripts/check-picasso-display-policy.py \
            --adt out/picasso/logs/adt-host-check/board-with-data.adt \
            --output out/picasso/host-checks/display-policy
          cp out/picasso/host-checks/display-policy/results.json out/picasso/logs/display-policy-host.json

      - name: Check reviewed PR19 probes and Linux host tool isolation
        run: |
          python3 scripts/check-picasso-pr19.py --output out/picasso/host-checks/pr19 \
            --adt out/picasso/logs/adt-host-check/board-with-data.adt
          cp out/picasso/host-checks/pr19/results.json out/picasso/logs/pr19-host.json

      - name: Check root input verifier failure paths
        run: |
          python3 scripts/check-picasso-root-inputs-host.py --output out/picasso/host-checks/root-inputs
          cp out/picasso/host-checks/root-inputs/results.json out/picasso/logs/root-inputs-host.json

      - name: Check bounded virtual input gestures
        run: |
          python3 scripts/check-picasso-hid-plan.py --output out/picasso/host-checks/hid-plan
          cp out/picasso/host-checks/hid-plan/results.json out/picasso/logs/hid-plan-host.json

      - name: Check physical PMIC buttons and HID teardown
        run: |
          python3 scripts/check-picasso-buttons.py --output out/picasso/host-checks/buttons
          cp out/picasso/host-checks/buttons/results.json out/picasso/logs/buttons-host.json

      - name: Check reviewed PR18 touch USB and sparse fixes
        run: |
          python3 scripts/check-picasso-pr18.py --output out/picasso/host-checks/pr18
          cp out/picasso/host-checks/pr18/results.json out/picasso/logs/pr18-host.json

      - name: Check native HID event dispatch
        run: |
          python3 scripts/check-picasso-hid-events.py --output out/picasso/host-checks/hid-events
          cp out/picasso/host-checks/hid-events/results.json out/picasso/logs/hid-events-host.json

      - name: Check authenticated UFS record cache
        run: |
          python3 scripts/check-picasso-ufs-cache.py --output out/picasso/host-checks/ufs-cache
          cp out/picasso/host-checks/ufs-cache/results.json out/picasso/logs/ufs-cache-host.json

      - name: Check UFS persistence window boundaries
        run: |
          python3 scripts/check-picasso-ufs-persistence.py --output out/picasso/host-checks/ufs-persistence
          cp out/picasso/host-checks/ufs-persistence/results.json out/picasso/logs/ufs-persistence-host.json

      - name: Check physical and virtual touch handoff
        run: |
          python3 scripts/check-picasso-novatek.py --output out/picasso/host-checks/novatek
          cp out/picasso/host-checks/novatek/results.json out/picasso/logs/novatek-host.json

      - name: Check persistent Data and dual record recovery
        run: |
          python3 scripts/check-picasso-persistence.py --tree "$UNIXNU_TREE" --output out/picasso/host-checks/persistent-data
          cp out/picasso/host-checks/persistent-data/results.json out/picasso/logs/persistent-data-host.json
          python3 scripts/check-picasso-record-reader.py --output out/picasso/host-checks/record-reader
          cp out/picasso/host-checks/record-reader/results.json out/picasso/logs/record-reader-host.json
          python3 scripts/check-picasso-seed-reuse.py --output out/picasso/host-checks/seed-reuse
          cp out/picasso/host-checks/seed-reuse/results.json out/picasso/logs/seed-reuse-host.json

      - name: Check staged apps runtime reserve
        run: |
          python3 scripts/check-picasso-staged-apps.py --output out/picasso/host-checks/staged-apps
          cp out/picasso/host-checks/staged-apps/results.json out/picasso/logs/staged-apps-host.json

      - name: Check runtime memory and swap boundaries
        run: |
          python3 scripts/check-picasso-runtime-memory.py --output out/picasso/host-checks/runtime-memory
          cp out/picasso/host-checks/runtime-memory/results.json out/picasso/logs/runtime-memory-host.json

      - name: Check unprotected KeyStore compatibility boundaries
        run: |
          python3 scripts/check-picasso-keystore.py --output out/picasso/host-checks/keystore
          cp out/picasso/host-checks/keystore/results.json out/picasso/logs/keystore-host-check.json

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-host-core-${{ github.run_id }}
          # Anchor log searches outside Data fixtures containing directory symlinks.
          path: |
            device/out/picasso/logs/**
            device/out/picasso/host-checks/display-policy/*.log
            device/out/picasso/host-checks/hid-plan/*.log
            device/out/picasso/host-checks/keystore/*.log
            device/out/picasso/host-checks/pr18/*.log
            device/out/picasso/host-checks/ui-runtime/startup/*.log
            device/out/picasso/host-checks/ufs-cache/*.log
            device/out/picasso/host-checks/ufs-persistence/*.log
            device/out/picasso/host-checks/novatek/*.log
            device/out/picasso/host-checks/linux-host/*.log
            device/out/picasso/host-checks/linux-host/*.json
          if-no-files-found: warn
          retention-days: 7

  # These two suites hash large logical disks. Give each its own CPU budget
  # while driver regressions run, without shrinking fixtures or caching results.
  seed-checks:
    name: seed-${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [format, identity]
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the pinned upstream packer
        run: |
          TREE=$(python3 ./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"
          mkdir -p out/picasso/seed-reports/logs
      - name: Check packed Data format and payload seed
        if: matrix.suite == 'format'
        run: |
          # bash pipefail preserves the test's failure through tee. Only logs
          # and reports are uploaded, never sparse fixtures or their symlinks.
          python3 scripts/check-picasso-ram-data.py --output out/picasso/host-checks/data \
            --packer "$UNIXNU_TREE/drivers/DarwinBoot/Test/packed_ramdisk.py" \
            2>&1 | tee out/picasso/seed-reports/logs/data-format.log
          cp out/picasso/host-checks/data/results.json out/picasso/seed-reports/logs/data-host-check.json
          python3 scripts/check-picasso-data-artifacts-host.py --output out/picasso/host-checks/payload-seed \
            2>&1 | tee out/picasso/seed-reports/logs/payload-seed.log
          cp out/picasso/host-checks/payload-seed/results.json out/picasso/seed-reports/logs/payload-seed-host.json
      - name: Check upstream Setup identity and Compose reuse
        if: matrix.suite == 'identity'
        run: |
          python3 scripts/check-picasso-setup-identity.py \
            --packer "$UNIXNU_TREE/drivers/DarwinBoot/Test/packed_ramdisk.py" \
            --output out/picasso/host-checks/setup-identity \
            2>&1 | tee out/picasso/seed-reports/logs/setup-identity.log
          cp out/picasso/host-checks/setup-identity/results.json out/picasso/seed-reports/logs/setup-identity-host.json
      - name: Upload seed regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-host-seed-${{ matrix.suite }}-${{ github.run_id }}
          path: device/out/picasso/seed-reports/
          if-no-files-found: warn
          retention-days: 7

  # Preserve the existing required check name. It must fail if any shard fails
  # or is skipped; a successful driver job alone is not a complete host check.
  checks:
    if: always()
    needs: [host-regressions, seed-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect host regression reports
        uses: actions/download-artifact@v4
        with:
          pattern: picasso-host-*-${{ github.run_id }}
          merge-multiple: true
          path: reports
      - name: Publish combined host reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-host-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
      - name: Require every regression shard
        if: always()
        env:
          CORE_RESULT: ${{ needs.host-regressions.result }}
          SEED_RESULT: ${{ needs.seed-checks.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$SEED_RESULT" = success

  ui-library:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and sign the iOS UI library
        run: |
          python3 scripts/build-picasso-sb-inject.py \
            package/picasso-springboard/picasso-springboard-probe.m out/libpicasso-sb.dylib
          python3 scripts/check-picasso-ui-trust.py --output out/ui-trust \
            --signed-library out/libpicasso-sb.dylib
      - name: Exercise the Objective-C ASTC failure boundary
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -framework Foundation -framework Metal -I package/picasso-springboard \
            scripts/tests/picasso-astc-guard-objc.m -o out/astc-guard-objc
          out/astc-guard-objc
      - name: Exercise status bar installation and inherited dispatch
        run: |
          set -o pipefail
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -framework Foundation -framework CoreGraphics -I package/picasso-springboard \
            scripts/tests/picasso-statusbar-objc.m -o out/statusbar-objc
          out/statusbar-objc | tee out/statusbar-objc.log
          out/statusbar-objc return | tee -a out/statusbar-objc.log
          out/statusbar-objc argument | tee -a out/statusbar-objc.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picasso-ui-library-${{ github.run_id }}
          path: |
            out/libpicasso-sb.dylib
            out/ui-trust/results.json
            out/statusbar-objc.log
          retention-days: 7
