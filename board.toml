# Redmi K30 5G (picasso, SM7250) firmware and kernel configuration.

[board]
name = "picasso"
soc = "SM7250"
description = "Redmi K30 5G"
kit = "picasso"

# iPhone X iOS 16 userland with the pinned Darwin 23 / 21H461 kernel backend.
[ipsw]
url = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,3"
version = "16.7.16"
build = "20H392"
device_class = "d22ap"
chip_id = 0x8015
board_id = 0x06
fetch = ["DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"087-86698-044.dmg" = "80f426d5b8fca8552f95be427434f1911dbb4c2c6d28aad94f2426ddd0c92483"
"087-86593-047.dmg" = "9cd738f3b0169055549df84ad6d8d13e50a2da39af618ce0522ca4e06df86849"
"kernelcache.release.iphone10b" = "2d6a13d040aaf87cec09bb6906d43e9bd8cea951e43d1aa1cd62707dfdc5aaec"
"DeviceTree.d22ap.im4p" = "480e8b0888949b4128b7aa2cd254497581c69e1bafa596a760b2fa955a8a6368"
"087-86698-044.dmg.trustcache" = "63e01c03b31e1532a5581a24865490673f0b5c297b0199fe0095637c6100ef4b"
"087-86593-047.dmg.trustcache" = "9cc478fe3525e2683b5b9ea1eea0851eaebebdab21d206556233400e59d2e361"

# UserData capacity: 0xBDEBFB000 bytes (47.48 GiB), 4096-byte sectors.
# This capacity bounds image creation; first_lba=0 is not a measured GPT start.
[userdata]
first_lba = 0x0
last_lba = 0xBDEBFA
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Native kernel and platform archives.
[kernel]
defconfig = "picasso_defconfig"
# Build selected platform, storage, security and display providers in order.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAdreno",
  "build-arm-driver.py AdrenoPicasso",
  "build-picasso-cpufreq.py",
  "build-arm-driver.py NativeWlan",
  # AppleImage4 waits for this real software-key IOAESAccelerator provider.
  "build-picasso-aes.py",
  # UFS physical windows are defined in the board driver.
  "build-arm-driver.py NativeUfs",
  # Persistent developer APFS Data; shares NativeUfs's exact original IOStorage bindings.
  "build-arm-driver.py NativeRamBlock",
  # Publishes the power-management nub, watchdog and volatile boot-stage storage.
  "build-picasso-pmgr.py",
  # CPU/GOP scanout and virtual input use the pinned original graphics and HID ABIs.
  "build-picasso-display.py",
  # Physical Novatek touch shares the owned HID device and checked firmware.
  "build-native-novatek-touch.py",
]

[kernel.prelink]
# Prelink the original components and bind the native watchdog service class.
tool = "scripts/prelink-picasso.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOHIDFamily",
  # Codeless personalities match the virtual keyboard and digitizer.
  "com.apple.iokit.IOHIDEventDriver",
  # Original IOBSD-matched IOSurfaceRoot, required by graphics/media clients.
  "com.apple.iokit.IOSurface",
  "com.apple.iokit.IOMobileGraphicsFamily",
  # Original IOAcceleratorES parent used by both display fallback and A620.
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOStorageFamily",
  # InterfaceNamer needs the original IOBSD-matched stack, even before Wi-Fi.
  "com.apple.iokit.IONetworkingFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kec.pthread",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  # Required for sandbox policy queries before launchd starts.
  "com.apple.security.sandbox",
]

# Kernel ABI donor is independent of the OS and SystemOS userland inputs.
[kernel.prelink.ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
kernel_member = "kernelcache.release.ipad7"
kernel_member_sha256 = "13b97fa2c5ce97f04408dcc28c41fb6b0d60b9440065197879acf44b2572bf7b"

# UEFI boot image layout.
[bootimg.image]
base = 0x0
kernel_offset = 0x8000
tags_offset = 0x1e00000
pagesize = 4096
header_version = 1
# The 60 MiB ramdisk fits the committed firmware mapping at this offset.
ramdisk_offset = 0x200000
[firmware]
config = "picasso"                   # Firmware configuration name
dsc = "Platforms/Xiaomi/picassoPkg/picasso.dsc"
fd = "Build/picassoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = []
# Required firmware cryptography submodule.
submodules = ["Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = []
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# ENABLE_SECUREBOOT must be a numeric 0 or 1 for conditional compilation.
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "picasso"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "picasso-research"

# FAT payload containing the config, kernel, trust caches and ADT.
[payload]
volume = "PICASSOESP"
# Seed baseline: keep this list stable for existing persistent Data identity.
# runtime_enabled_jobs below is applied before launchd to both new and restored Data.
# Exact 20H392 labels, selected by job label, plist name or executable name.
# watchdogd stays disabled; wdt=0 disables its checkin policy below.
runtime_enabled_jobs = ["com.apple.bluetoothd"]
# bluetoothd supplies the BTAudioHALPlugin service; radio hardware is unimplemented.
offline_disabled_jobs = [
  "com.apple.BTServer.avrcp",
  "com.apple.BTServer.le",
  "com.apple.BTServer.map",
  "com.apple.BTServer.pbap",
  "com.apple.BluetoothUIService",
  "com.apple.CommCenter",
  "com.apple.CommCenterMobileHelper",
  "com.apple.CommCenterRootHelper",
  "com.apple.ReportCrash",
  "com.apple.RestoreRemoteServices.restoreserviced",
  "com.apple.SepUpdateTimer",
  "com.apple.accessoryd",
  "com.apple.applecamerad",
  "com.apple.avconferenced",
  "com.apple.backupd",
  "com.apple.biometrickitd.pearl",
  "com.apple.bird",
  "com.apple.bluetoothd",
  "com.apple.bluetoothuserd",
  "com.apple.companioncamerad",
  "com.apple.dietapplecamerad",
  "com.apple.dietappleh13camerad",
  "com.apple.dmd",
  "com.apple.duetexpertd",
  "com.apple.homed",
  "com.apple.locationd",
  "com.apple.mobile.keybagd",
  "com.apple.mobile.lockdown",
  "com.apple.mobile.obliteration",
  "com.apple.mobile.softwareupdated",
  "com.apple.mobile.storage_mounter",
  "com.apple.mobile.storage_mounter_proxy",
  "com.apple.mobileassetd",
  "com.apple.nanobackupd",
  "com.apple.nfcd",
  "com.apple.nfrestore",
  "com.apple.osanalytics.osanalyticshelper",
  "com.apple.photoanalysisd",
  "com.apple.ptpcamerad",
  "com.apple.purplebuddy.budd",
  "com.apple.routined",
  "com.apple.softwareupdateservicesd",
  "com.apple.syncdefaultsd",
  "com.apple.thermalmonitord",
  "com.apple.timesync.audioclocksyncd",
  "com.apple.usb.networking.addNetworkInterface",
  "com.apple.usbsmartcardreaderd",
  "com.apple.watchdogd",
  "com.apple.wifi.hostapd",
  "com.apple.wifi.wapic",
  "com.apple.wifiFirmwareLoader",
  "com.apple.wifianalyticsd",
  "com.apple.wifid",
  "com.apple.wifip2pd",
  "com.apple.wifivelocityd",
]
# Use the selected iOS build for Setup/migration flags and disable automatic dimming.
skip_setup_tool = "scripts/picasso-seed-skip-setup.py"
# Native rectangular status bar: time at left, no carrier label or date.
skip_setup_args = ["--no-auto-dim", "--inject-lib", "out/picasso/libpicasso-sb.dylib", "--statusbar-provider", "_UIStatusBarVisualProvider_Pad_ForcedNoCell"]
# Fits the kernel, trust caches and packed Data seed within the 95% content limit.
size_mib = 60
loader = "firmware"
title = "Boot"
dram_size = "0x180000000"
# Keep kprintf enabled; the console is carried by USB CDC.
# Enable eight cores with PSCI, routed SPI IPIs and the initial self-IPI.
kernel_args = [
  "-v",
  "debug=0x14e",
  # Disable original userspace checkins; retain the native 15 s hardware watchdog.
  "wdt=0",
  "cpus=8",
  "sheng-smp=1",
  "armcpu-self-ipi=1",
  "armcpu-spi-ipi=1",
  # Request the top CPU frequency row; hardware limits still apply.
  "armcpu-cpufreq=1",
  "sheng-cpufreq=4",
  # Apply the Picasso status bar metric in SpringBoard and main app executables.
  "picasso_inject_sb=/usr/lib/libpicasso-sb.dylib",
  "picasso_inject_apps=1",
  # Permit the library signature for bring-up; keep cs_enforcement_disable unset.
  "amfi_allow_any_signature=1",
  # Gate PM8150L WLED on verified OS display-power requests.
  "picasso-wled=1",
  # Keep the initial logo through blank swaps until UI pixels arrive (at most 300 s).
  "picasso-boot-logo-hold=1",
  # Start the authenticated UFS root and required power-management nub.
  "native-ufs-root=1",
  "sheng-pmgr=2",
  # NativeUfs defaults already wait 5 s for USB and use timebase/yield waits.
  # Omit these two redundant overrides to stay within the boot-argument budget.
  # Verbose UFS tracing uses its disabled default.
  # Allow interrupt-context diagnostics to reach the USB console.
  "nointr_consio=1",
  # Also allow IOLog diagnostics in interrupt context.
  "nointr_iolog=1",
  # USB CDC streaming: 1 = state probe, 2 = live console.
  "picasso_usb=2",
  # Apply the guarded USB stream 0xe0 bypass before controller startup.
  "picasso_usb_smmu=6",
  # USB hold uses its disabled default; continue to root mounting.
  # Keep a 1-second synchronous command window after the USB enumeration handoff.
  "picasso_usb_control_ms=1000",
  # Arm the Fastboot reason and use PSHOLD as the reset fallback.
  "picasso_usb_reset=pshold",
  # Original graphics class loading and post-IOBSD GOP handoff.
  "offline-mobile-graphics-load=1",
  "offline-legacy-register=1",
  "offline-legacy-phase=4",
  "offline-legacy-gop=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  # Offer frames to the GPU client; keep the CPU path when no client accepts.
  "sheng-fb-gpu=1",
  # Rebuild application registration after the staged Applications view mounts.
  "picasso-ls-rebuild=1",
  "sheng-staged-apps=1",
  # Keep boot diagnostic painters from covering the system UI.
  "sheng-banner=0",
  # State queries only for unprotected developer Data; no keybag/key operations.
  "picasso-aks-state=1",
  "sheng-data-persist=2",
  "picasso-data-init-blank=1",
  # One-time 20 GiB replacement; persistent journal prevents subsequent resets.
  "picasso-data-replace-20g=1",
  "picasso-persist-records=1",
  # Software refresh notifications only; panel timing remains firmware-owned.
  "sheng-vsync=60",
  # Virtual input: after HID and two frames are ready, wake at 5 s and swipe at 8 s.
  # Repeat at 60 s intervals, up to eight attempts; failure releases the contact.
  "offline-hid-input=1",
  "sheng-touch-hid=1",
  # Download the pinned firmware and deliver physical contacts after HID is ready.
  "sheng-touch=4",
  # PM8150 PON power/down and PM8150L GPIO5 up, SPMI v5 observer reads.
  "picasso-buttons=1",
  "offline-hid-auto-home=5",
  "offline-hid-swipe-delay=8",
  "offline-hid-auto-home-count=8",
  "offline-hid-swipe=8",
]
# Keep framebuffer panic rendering off while USB CDC captures diagnostics.
panic_screen = false
# Pin the original static and System trust-cache bundle passed through the ADT.
trust_cache_sha256 = ["eb1475f643f45a974ebd40596f6e2b1cdf40205d2ca3c6094d774886099399c3"]
# An extended bundle must retain both pinned modules and trust exactly this signed library.
owned_trust_library = "out/picasso/libpicasso-sb.dylib"

[payload.adt]
tool = "scripts/make-picasso-adt.py"
chip_id = "7250"
# Pass packed nonzero Data pages; persist changed pages in the guarded UFS Data window.
packed_data_ramdisk = true
persistent_data = true
# Explicit unencrypted developer storage; does not claim keybag/password support.
unprotected_developer_data = true
# Use the original iPhone X identity and phone/2436/3/P3 artwork.
iphone_identity = true
# Select the authenticated OS volume by UUID; verify its signed image independently.
root_match_volume_uuid = "DADD93F8-DBBF-4B17-A1DF-0F11E64172F7"
# Request the 5 GiB contiguous run published by the PR13 firmware.
# DarwinBoot clamps it to the largest free run; packed Data stays sparse.
owned_memory_size = "0x140000000"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
unique_chip_id = "required"
