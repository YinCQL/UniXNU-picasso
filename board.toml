# Board description of the Redmi K30 5G (picasso, SM7250), read by the unixnu build driver.
# Minimal skeleton to build the UniXNU UEFI firmware. Kernel/IPSW/UserData sections are
# placeholders to be filled during kernel bring-up.

[board]
name = "picasso"
soc = "SM7250"
description = "Redmi K30 5G"
kit = "picasso"

# Target OS image. PLACEHOLDER   select an IPSW whose ARM version is compatible with
# SM7250 (ARMv8.2 / Cortex-A76). Only needed for the kernel step, not for firmware.
[ipsw]
# Same unchanged iPad7,1 iPadOS 17.7.11 image uke (SM7675) and sheng (SM8550) use.
# SM7250 (ARMv8.2 / Cortex-A76) is instruction-compatible with this kernel source.
url = "https://updates.cdn.apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]

# UserData partition geometry (GPT entry "userdata" of LUN 0). PLACEHOLDER.
[userdata]
first_lba = 0x0
last_lba = 0x0
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Kernel configuration. PLACEHOLDER for kernel bring-up.
[kernel]
defconfig = "picasso_defconfig"
# First-console archives: only what the minimal picasso_defconfig selects
# (corecrypto, ArmDTPlatform, ArmCpu, arch timer). UFS / VirtIO / display /
# Adreno are added in later stages once the platform reaches the console.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = ""
slide = "-0x1000000"
early_security_init = ""
roots = [
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
]

# Firmware step: build the picasso Mu-Silicium UEFI firmware via unixnu.
[firmware]
config = "picasso"                   # Resources/Configs/picasso.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Xiaomi/picassoPkg/picasso.dsc"
fd = "Build/picassoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = []
# Openssl submodule is required by Silicon/Silicium OpensslPkg (same as sheng and the
# stock picasso DeviceBuild.py RequiredSubmodules).
submodules = ["Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = []
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# Full set aligned with sheng so SecureBootHandler.c and other #if-gated code compile
# (ENABLE_SECUREBOOT must be 0/1, not empty, or '#if ENABLE_SECUREBOOT == 1' is a syntax error).
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "picasso"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "picasso-research"

# Payload: a FAT volume with UniXNU config + kernel + ADT. Loader (DarwinBoot) is in the firmware.
[payload]
volume = "PICASSOESP"
size_mib = 128
loader = "firmware"
title = "picasso first boot: source XNU to console"
dram_size = "0x80000000"
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
]

[payload.adt]
tool = "scripts/make-picasso-adt.py"
chip_id = "0"
owned_memory_size = "0x100000000"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
unique_chip_id = "required"
