# Board description of the Redmi K30 5G (picasso, SM7250), read by the unixnu build driver.
# Minimal skeleton to build the UniXNU UEFI firmware. Kernel/IPSW/UserData sections are
# placeholders to be filled during kernel bring-up.

[board]
name = "picasso"
soc = "SM7250"
description = "Redmi K30 5G"
kit = "picasso"

# Target OS image. PLACEHOLDER   select an IPSW whose ARM version is compatible with
# SM7250 (ARMv8.2 / Cortex-A76). Only needed for the kernel step, not for firmware.
[ipsw]
# Same unchanged iPad7,1 iPadOS 17.7.11 image uke (SM7675) and sheng (SM8550) use.
# SM7250 (ARMv8.2 / Cortex-A76) is instruction-compatible with this kernel source.
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]

# UserData partition geometry (GPT entry "userdata" of LUN 0). PLACEHOLDER.
# The silenzio111 branch measured first_lba = 0x200000, last_lba = 0x3A00000 on this
# board; those values stay unverified here and the kernel/payload steps do not read
# them, so the safe placeholder is kept until "unixnu build userdata" is brought up.
[userdata]
first_lba = 0x0
last_lba = 0x0
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Kernel configuration. PLACEHOLDER for kernel bring-up.
[kernel]
defconfig = "picasso_defconfig"
# First-console archives: only what the minimal picasso_defconfig selects
# (corecrypto, ArmDTPlatform, ArmCpu, arch timer). UFS / VirtIO / display /
# Adreno are added in later stages once the platform reaches the console:
# configs/picasso_platform_defconfig lists the stage-6 draft, and its archives
# would be "build-libpthread-kernel.py", "build-arm-driver.py NativeUfs" and
# "build-arm-driver.py NativeAdreno" appended below.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = ""
slide = "-0x1000000"
early_security_init = ""
roots = [
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
]

# Firmware step: build the picasso Mu-Silicium UEFI firmware via unixnu.
[bootimg.image]
base = 0x0
kernel_offset = 0x8000
tags_offset = 0x1e00000
pagesize = 4096
header_version = 1
# The ABL loads kernel + ramdisk into one buffer that starts at abl_base
# (0xB4513000 on this device, derived from the observed initrd address) and ends
# at 0xB7E00000, so the whole payload window is about 57 MiB. With the default
# ramdisk_offset of 0x1000000 the ramdisk starts at 0xB5513000 and only 42.6 MiB
# fit, which truncated the 120 MiB payload: the FAT volume claimed 120 MiB while
# only the first 42.9 MiB were in memory, and FatPkg faulted at 0xB7BFE000.
# 0x200000 puts the ramdisk right after the ~2.1 MiB kernel slot, leaving 54.8 MiB.
ramdisk_offset = 0x200000
[firmware]
config = "picasso"                   # Resources/Configs/picasso.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Xiaomi/picassoPkg/picasso.dsc"
fd = "Build/picassoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = []
# Openssl submodule is required by Silicon/Silicium OpensslPkg (same as sheng and the
# stock picasso DeviceBuild.py RequiredSubmodules).
submodules = ["Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = []
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# Full set aligned with sheng so SecureBootHandler.c and other #if-gated code compile
# (ENABLE_SECUREBOOT must be 0/1, not empty, or '#if ENABLE_SECUREBOOT == 1' is a syntax error).
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "picasso"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "picasso-research"

# Payload: a FAT volume with UniXNU config + kernel + ADT. Loader (DarwinBoot) is in the firmware.
[payload]
volume = "PICASSOESP"
size_mib = 54
loader = "firmware"
title = "Boot"
dram_size = "0x80000000"
# serial=3 was dead weight here and could stall early boot: pe_serial.c only
# registers PI3_UART, APPLE_UART, DOCKCHANNEL_UART and VMAPPLE_UART. SM7250 is a
# Qualcomm GENI UART, so serial_init() returns 0 and PE_kputc falls back to
# console_write_unbuffered -> vcputc_options, which is a no-op until the IOKit
# video console binds the framebuffer. Asking for serial output therefore bought
# nothing and left the boot without a console. debug=0x14e keeps DB_KPRT (0x8),
# so kprintf is still enabled; the flags are 0x2 and 0x4 (NMI) plus 0x40 (ARP)
# and 0x100 (obsolete), none of which halt early.
# Also pin the platform explicitly: cpus=1 avoids spinning up seven secondary
# cores before the platform expert has an interrupt controller.
kernel_args = [
  "-v",
  "debug=0x14e",
  "cpus=1",
]
# Stage-5 blind-spot instrumentation (docs/zh/guide/debugging.md 颜色条):
# scripts/patch-xnu-entry-probe.py (ported from UniXNU-sheng; it adapts itself
# to this kernel via the symbol table) paints a blue bar at the kernel entry,
# a magenta bar just before the MMU comes on, and reboots the device via PSCI
# SYSTEM_RESET entry_probe_reset_delay seconds after the MMU is enabled --
# a spontaneous reboot after that delay is the signal that start.s completed.
# panic_screen redirects panic() to a renderer that draws on the kernel's own
# framebuffer mapping, so any panic after PE_create_console becomes readable.
# Bisect deeper with entry_probe_reset_after (one call per run; payload.py keys
# map to the script's --reset-after/--in/--occurrence options).
# Bisect log (2026-10-24), one probe per run; ~6 s reboot = the call completed:
#   run 1  after-MMU        -> reboot : start.s complete (genuine: cave 16-aligned)
#   run 2  _arm_vm_init     -> VOID   : tight-packing bug (below) made cave4 bl
#   run 3  _PE_create_console -> VOID   : land at callee-4 (previous function tail)
#   run 4  _PE_init_platform #2 -> hang + panic text: the miswired bl landed on
#         PE_slide_devicetree's `bl .cold` tail = exactly the observed
#         "pe_init.c:418 Assertion failed: PE_state.initialized". The text
#         itself proves PE_create_console/PE_init_printf/cpu_machine_idle_init
#         all completed (those calls were untouched).
#   run 5  same target, caves now 16-aligned (lld aligns .text to 16; an
#         unaligned cave shifts every defsym branch 4 bytes early): ~6 s
#         reboot = the real second PE_init_platform (GIC MMIO) completed;
#         hang/panic = it dies inside it. The panic screen now also reports
#         lr= (the panic call site), PEini= (PE_state.initialized) and fb=,
#         and mirrors the message to the /pram panic region: read it after a
#         reset with scripts/dump-picasso-panic.py --fastboot --paddr 0xB7F00000.
panic_screen = true
entry_probe_reset_delay = 6
entry_probe_reset_after = "_PE_init_platform"
entry_probe_reset_occurrence = 2

[payload.adt]
tool = "scripts/make-picasso-adt.py"
chip_id = "7250"
# DarwinBoot requests one contiguous window of this size from the firmware and
# hands it to the kernel as boot_args.memSize. The kernel then builds its physmap
# over exactly that range, so the window has to fit inside a single
# conventional-memory run.
#
# 0x100000000 (4 GiB) cannot fit here. The first DRAM bank is
# 0x80000000..0xBCC00000 (972 MiB) per the device DT, and picassoPkg's
# MemoryMapLib exposes only the "Boot Ramdisk Gap" 0xAD000000..0xBCC00000 as
# SYS_MEM (252 MiB). DarwinBoot still reports success at 4 GiB because
# AllocatePages only records the range as owned, but arm_vm_init() then builds a
# 4 GiB physmap starting at the window base 0xC007C000, which runs past the end
# of real DRAM to 0x1C007C000. Touching that faults with the MMU already on and
# no console bound yet -- the silent hang after the green bar.
#
# 256 MiB is DarwinWindowSizeValid()'s minimum (0x10000000..0x200000000 in 2 MiB
# steps) and fits inside the 252 MiB SYS_MEM run.
owned_memory_size = "0x10000000"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
unique_chip_id = "required"
