# Redmi K30 5G (picasso, SM7250) firmware and kernel configuration.

[board]
name = "picasso"
soc = "SM7250"
description = "Redmi K30 5G"
kit = "picasso"

# iPhone X iOS 16 userland with the pinned Darwin 23 / 21H461 kernel backend.
[ipsw]
url = "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,3"
version = "16.7.16"
build = "20H392"
device_class = "d22ap"
chip_id = 0x8015
board_id = 0x06
fetch = ["DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"087-86698-044.dmg" = "80f426d5b8fca8552f95be427434f1911dbb4c2c6d28aad94f2426ddd0c92483"
"087-86593-047.dmg" = "9cd738f3b0169055549df84ad6d8d13e50a2da39af618ce0522ca4e06df86849"
"kernelcache.release.iphone10b" = "2d6a13d040aaf87cec09bb6906d43e9bd8cea951e43d1aa1cd62707dfdc5aaec"
"DeviceTree.d22ap.im4p" = "480e8b0888949b4128b7aa2cd254497581c69e1bafa596a760b2fa955a8a6368"
"087-86698-044.dmg.trustcache" = "63e01c03b31e1532a5581a24865490673f0b5c297b0199fe0095637c6100ef4b"
"087-86593-047.dmg.trustcache" = "9cc478fe3525e2683b5b9ea1eea0851eaebebdab21d206556233400e59d2e361"

# UserData capacity: 0xBDEBFB000 bytes (47.48 GiB), 4096-byte sectors.
# This capacity bounds image creation; first_lba=0 is not a measured GPT start.
[userdata]
first_lba = 0x0
last_lba = 0xBDEBFA
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# Native kernel and platform archives.
[kernel]
defconfig = "picasso_defconfig"
# Build selected platform, storage, security and display providers in order.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  # AppleImage4 waits for this real software-key IOAESAccelerator provider.
  "build-picasso-aes.py",
  # UFS physical windows are defined in the board driver.
  "build-arm-driver.py NativeUfs",
  # Volatile APFS Data; shares NativeUfs's exact original IOStorage bindings.
  "build-arm-driver.py NativeRamBlock",
  # Publishes the power-management nub, watchdog and volatile boot-stage storage.
  "build-picasso-pmgr.py",
  # CPU/GOP scanout and virtual input use the pinned original graphics and HID ABIs.
  "build-picasso-display.py",
  # Physical Novatek touch shares the owned HID device and checked firmware.
  "build-native-novatek-touch.py",
]

[kernel.prelink]
# Prelink the original components and bind the native watchdog service class.
tool = "scripts/prelink-picasso.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOHIDFamily",
  # Codeless personalities match the virtual keyboard and digitizer.
  "com.apple.iokit.IOHIDEventDriver",
  # Original IOBSD-matched IOSurfaceRoot, required by graphics/media clients.
  "com.apple.iokit.IOSurface",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kec.pthread",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  # Required for sandbox policy queries before launchd starts.
  "com.apple.security.sandbox",
]

# Kernel ABI donor is independent of the OS and SystemOS userland inputs.
[kernel.prelink.ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
kernel_member = "kernelcache.release.ipad7"
kernel_member_sha256 = "13b97fa2c5ce97f04408dcc28c41fb6b0d60b9440065197879acf44b2572bf7b"

# UEFI boot image layout.
[bootimg.image]
base = 0x0
kernel_offset = 0x8000
tags_offset = 0x1e00000
pagesize = 4096
header_version = 1
# The 60 MiB ramdisk fits the committed firmware mapping at this offset.
ramdisk_offset = 0x200000
[firmware]
config = "picasso"                   # Firmware configuration name
dsc = "Platforms/Xiaomi/picassoPkg/picasso.dsc"
fd = "Build/picassoPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = []
# Required firmware cryptography submodule.
submodules = ["Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = []
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
# ENABLE_SECUREBOOT must be a numeric 0 or 1 for conditional compilation.
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "picasso"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "picasso-research"

# FAT payload containing the config, kernel, trust caches and ADT.
[payload]
volume = "PICASSOESP"
# Volatile Data excludes unavailable hardware, account and background services.
# watchdogd stays disabled; wdt=0 disables its checkin policy below.
offline_disabled_jobs = [
  "com.apple.watchdogd",
  "com.apple.BTServer.avrcp", "com.apple.BTServer.le", "com.apple.BTServer.map",
  "com.apple.BTServer.pbap", "com.apple.ClarityBoard", "com.apple.CommCenter",
  "com.apple.CommCenterMobileHelper", "com.apple.CommCenterRootHelper", "com.apple.DumpPanic",
  "com.apple.MobileInternetSharing", "com.apple.OTACrashCopier", "com.apple.ReportCrash",
  "com.apple.RestoreRemoteServices.restoreserviced", "com.apple.WirelessRadioManager",
  "com.apple.abm-helper", "com.apple.accessibility.axremoted", "com.apple.accessoryd",
  "com.apple.accessoryupdaterd", "com.apple.applecamerad", "com.apple.appstored",
  "com.apple.assistantd", "com.apple.avconferenced", "com.apple.awdd", "com.apple.backupd",
  "com.apple.biometrickitd.pearl", "com.apple.bird", "com.apple.bluetoothd",
  "com.apple.bluetoothuserd", "com.apple.brook.brookcompaniond", "com.apple.carkitd",
  "com.apple.checkerboard", "com.apple.checkerboardd", "com.apple.cloudpaird",
  "com.apple.companioncamerad", "com.apple.corespeechd", "com.apple.dhcp6d",
  "com.apple.dietapplecamerad", "com.apple.dietappleh13camerad", "com.apple.dmd",
  "com.apple.dt.AutomationModeUI", "com.apple.duetexpertd", "com.apple.exchangesyncd",
  "com.apple.factory.NFQRCoded", "com.apple.fairplayd.H2", "com.apple.fairplaydeviceidentityd",
  "com.apple.gpsd", "com.apple.healthd", "com.apple.homed", "com.apple.icloud.findmydeviced",
  "com.apple.identityservicesd", "com.apple.imagent", "com.apple.iomfb_bics_daemon",
  "com.apple.itunesstored", "com.apple.locationd", "com.apple.magicswitchd.companion",
  "com.apple.mediastream.mstreamd", "com.apple.mobile.keybagd", "com.apple.mobile.lockdown",
  "com.apple.mobile.obliteration", "com.apple.mobile.softwareupdated",
  "com.apple.mobile.storage_mounter", "com.apple.mobile.storage_mounter_proxy",
  "com.apple.mobileassetd", "com.apple.mobilerepaird", "com.apple.mobilestoredemod",
  "com.apple.mobilestoredemodhelper", "com.apple.nanobackupd",
  "com.apple.nanomediaremotelinkagent", "com.apple.nanophone", "com.apple.nanoprefsyncd.2",
  "com.apple.nanoregistryd", "com.apple.navd", "com.apple.nearbyd", "com.apple.nfcd",
  "com.apple.nfrestore", "com.apple.nptocompaniond", "com.apple.osanalytics.osanalyticshelper",
  "com.apple.pairedsyncd", "com.apple.peakpowermanagerd", "com.apple.photoanalysisd",
  "com.apple.ptpcamerad", "com.apple.ptpd", "com.apple.purplebuddy.budd", "com.apple.rapportd",
  "com.apple.remindd", "com.apple.remoted", "com.apple.routined", "com.apple.safetyalertsd",
  "com.apple.sharingd", "com.apple.softwareupdateservicesd", "com.apple.sosd",
  "com.apple.syncdefaultsd", "com.apple.terminusd", "com.apple.thermalmonitord",
  "com.apple.timesync.audioclocksyncd", "com.apple.triald", "com.apple.tvremoted",
  "com.apple.usb.networking.addNetworkInterface", "com.apple.usbsmartcardreaderd",
  "com.apple.wifi.hostapd", "com.apple.wifi.wapic", "com.apple.wifiFirmwareLoader",
  "com.apple.wifianalyticsd", "com.apple.wifip2pd", "com.apple.wifivelocityd"
]
# Use the selected iOS build for Setup/migration flags and disable automatic dimming.
skip_setup_tool = "scripts/picasso-seed-skip-setup.py"
# Native phone status bar layout for the 360-point-wide GOP screen.
skip_setup_args = ["--no-auto-dim", "--inject-lib", "out/picasso/libpicasso-sb.dylib", "--statusbar-provider", "_UIStatusBarVisualProvider_LegacyPhone"]
# Fits the kernel, trust caches and packed Data seed within the 95% content limit.
size_mib = 60
loader = "firmware"
title = "Boot"
dram_size = "0x80000000"
# Keep kprintf enabled; the console is carried by USB CDC.
# Enable eight cores with PSCI, routed SPI IPIs and the initial self-IPI.
kernel_args = [
  "-v",
  "debug=0x14e",
  # Disable original userspace checkins; retain the native 15 s hardware watchdog.
  "wdt=0",
  "cpus=8",
  "sheng-smp=1",
  "armcpu-self-ipi=1",
  "armcpu-spi-ipi=1",
  # Request the top CPU frequency row; hardware limits still apply.
  "armcpu-cpufreq=1",
  # Inject the ad-hoc signed SpringBoard probe from volatile Data.
  "picasso_inject_sb=/private/var/picasso/libpicasso-sb.dylib",
  # Permit the probe signature for bring-up; keep cs_enforcement_disable unset.
  "amfi_allow_any_signature=1",
  # Reject framebuffer power-off during bring-up; black frames can still be presented.
  "picasso-fb-reject-off=1",
  # Keep the initial logo through blank swaps until UI pixels arrive (at most 300 s).
  "picasso-boot-logo-hold=1",
  # Start the authenticated UFS root and required power-management nub.
  "native-ufs-root=1",
  "sheng-pmgr=2",
  # Delay UFS publication until the USB console is available.
  "native-ufs-start-delay=5",
  # Use timebase/yield waits and bounded scan batches during early UFS startup.
  "native-ufs-delay-yield=1",
  # Keep verbose UFS command tracing disabled during system boot.
  "native-ufs-diagnostics=0",
  # Allow interrupt-context diagnostics to reach the USB console.
  "nointr_consio=1",
  # Also allow IOLog diagnostics in interrupt context.
  "nointr_iolog=1",
  # USB CDC streaming: 1 = state probe, 2 = live console.
  "picasso_usb=2",
  # Apply the guarded USB stream 0xe0 bypass before controller startup.
  "picasso_usb_smmu=6",
  # Continue to root mounting after the console starts.
  "picasso_usb_hold=0",
  # Keep a 1-second synchronous command window after the USB enumeration handoff.
  "picasso_usb_control_ms=1000",
  # Arm the Fastboot reason and use PSHOLD as the reset fallback.
  "picasso_usb_reset=pshold",
  # Original graphics class loading and post-IOBSD GOP handoff.
  "offline-mobile-graphics-load=1",
  "offline-legacy-register=1",
  "offline-legacy-phase=4",
  "offline-legacy-gop=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  # State queries only for unprotected RAM Data; no keybag/key operations.
  "picasso-aks-state=1",
  # Software refresh notifications only; panel timing remains firmware-owned.
  "sheng-vsync=60",
  # Virtual input: after HID and two frames are ready, wake at 5 s and swipe at 8 s.
  # Repeat at 60 s intervals, up to eight attempts; failure releases the contact.
  "offline-hid-input=1",
  "sheng-touch-hid=1",
  # Download the pinned firmware and deliver physical contacts after HID is ready.
  "sheng-touch=4",
  "offline-hid-auto-home=5",
  "offline-hid-swipe-delay=8",
  "offline-hid-auto-home-count=8",
  "offline-hid-swipe=8",
]
# Keep framebuffer panic rendering off while USB CDC captures diagnostics.
panic_screen = false
# Pin the original static and System trust-cache bundle passed through the ADT.
trust_cache_sha256 = ["eb1475f643f45a974ebd40596f6e2b1cdf40205d2ca3c6094d774886099399c3"]

[payload.adt]
tool = "scripts/make-picasso-adt.py"
chip_id = "7250"
# Pass packed nonzero Data pages; allocate writes on demand with ephemeral storage.
packed_data_ramdisk = true
# Use the original iPhone X identity and phone/2436/3/P3 artwork.
iphone_identity = true
# Select the authenticated OS volume by UUID; verify its signed image independently.
root_match_volume_uuid = "DADD93F8-DBBF-4B17-A1DF-0F11E64172F7"
# Reserve 768 MiB of contiguous conventional memory for XNU and volatile Data.
# Firmware must allocate the whole range; this is separate from FAT and dram_size.
owned_memory_size = "0x30000000"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
unique_chip_id = "required"
