schema_version = 1

[device]
name = "picasso"
soc = "SM7250"
os_profile = "ipados-17.7.11-21H461"
summary = "Redmi K30 5G bring-up has reached Adreno 620 GPU integration. Main targets iPadOS 17.7.11; CPU/GOP, authenticated UFS root and Novatek touch are implemented. PR13 reports GPU rendering with external Metal/Turnip inputs. Sustained UI stability, networking, audio and full power management remain unfinished."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu"]
paths = ["board.toml", "upstream.rev", "unixnu", "configs/**", ".gitmodules", ".gitignore", ".github/**"]
inputs = ["SM7250/picasso, iPad7,1 iPadOS 17.7.11 build 21H461 and the legacy UniXNU source overlay."]
configuration = ["board.os_profile = ipados-17.7.11-21H461; kernel.defconfig = picasso_defconfig; upstream.rev = 75fba878a97af05ac990fe0310095f40c5681ceb.", "kernel.archives is an ordered replacement list: corecrypto, ArmDTPlatform, ArmCpu, Picasso AES, NativeUfs, NativeAdreno, AdrenoPicasso, NativeRamBlock, PMGR and Legacy display."]
procedure = ["Inspect board.toml, configs/picasso_defconfig and upstream.rev.", "Run python3 ./unixnu --prepare to clone the pinned upstream and apply the board overlay in its isolated cache.", "Check the resolved archive and prelink inputs before building kernel/prelink."]
findings = ["Main uses 21H461; feat/ios16-gpu is a separate OS target and its device results must not be substituted for main results.", "The joined default kernel_args was 1012 bytes. Omitting native-ufs-diagnostics=0 and picasso_usb_hold=0 reduces it to 968 bytes; both consumers initialize the value to zero. Boot, watchdog, input and GPU selections remain explicit.", "This board uses the legacy archive recipe. os_profile is identity metadata; adding the record does not migrate the builder to format 2. Catalog IDs below describe reusable interfaces and lineage; SM7250 board modules are identified by their actual paths and build names.", "The default main branch exposes the Build Picasso Kernel (Linux) manual workflow at .github/workflows/build-kernel-linux.yml. Selecting test/pr17 runs that branch's full kernel workflow; main only prints the branch-selection instructions and performs no compilation.", "The manual Publish Picasso Linux Toolchain workflow packages an already qualified branch cache, verifies the package on a fresh Ubuntu24 x86_64 runner and publishes a numbered immutable Release with archive/manifest digests. main provides branch-selection guidance; the publisher does not build the kernel."]
completion = ["The source pin resolves, ordered archives and patches match this board, and the final joined kernel command line passes the payload builder's 1000-byte guard."]
limits = ["Format-2 profile/component resolution is not enabled. Additional command-line overrides consume the same 1000-byte budget."]
next_action = ["Check the final payload.json command line and effective archive selection with each new image."]
evidence = [{kind = "source", reference = "board.toml", result = "Target identity, ordered archives, prelink roots and default arguments."}, {kind = "source", reference = "unixnu", result = "Pinned isolated overlay preparation and legacy build entry point."}, {kind = "source", reference = "drivers/NativeUfs/NativeUfs.cpp", result = "The UFS diagnostic value defaults to zero."}, {kind = "source", reference = "patches/picasso-usb-console-xnu.patch", result = "The USB hold value defaults to zero."}, {kind = "source", reference = ".github/workflows/publish-linux-toolchain.yml", result = "Qualified immutable Linux toolchain packaging and fresh-runner verification."}]

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["uefi/**", "patches/firmware/**"]
inputs = ["Mu-Silicium Picasso FD, BootShim, device DTB, GOP framebuffer, PSCI SMC and conventional-memory map."]
configuration = ["firmware.config = picasso; firmware.dsc = Platforms/Xiaomi/picassoPkg/picasso.dsc; payload.loader = firmware.", "Android boot header v1, 4096-byte pages, kernel_offset = 0x8000, ramdisk_offset = 0x200000 and tags_offset = 0x1e00000."]
procedure = ["Build Mu-Silicium with the Picasso configuration and retain its source revision, FD hash and DTB.", "Copy the intended FD to uefi/SILICIUM_UEFI.fd; compose BootShim/FD/DTB and the FAT ramdisk using the declared Android layout.", "During a temporary boot, capture the firmware memory map, GOP geometry and DarwinBoot allocation before ExitBootServices."]
findings = ["The Android kernel slot contains BootShim and UEFI; DarwinBoot loads XNU from the FAT payload and passes a generated ADT, distinct from the firmware DTB.", "PR13 adds publication of high DRAM banks and clamps the 5 GiB kernel-window request to available conventional memory. Both the FD and kernel topology inputs must correspond to the intended build."]
completion = ["UEFI enters its boot menu, loads the intended payload, starts XNU through PSCI and preserves framebuffer and reserved-memory handoff."]
limits = ["Firmware and panel initialization are external to the XNU display driver. A committed FD alone does not identify the firmware used in a device log."]
next_action = ["Record FD/DTB hashes and the final conventional-memory allocation with the next main image."]
evidence = [{kind = "source", reference = "uefi/README.md", result = "FD source and replacement procedure."}, {kind = "source", reference = "patches/firmware/mu-silicium-publish-all-dram.patch", result = "Firmware DRAM publication adjustment."}, {kind = "source", reference = "patches/firmware/darwinboot-window-clamp.patch", result = "Loader allocation clamps to an available contiguous run."}]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform"]
paths = ["drivers/ArmCpu/**", "drivers/NativeCpuFreq/**", "patches/picasso-cpu-*.patch", "scripts/*cpufreq*"]
inputs = ["Six Cortex-A55 and two Cortex-A76 cores; MPIDR affinities 0x000..0x700; GICv3 distributor 0x17a00000/0x10000 and redistributors 0x17a60000/0x100000; 19.2 MHz counter."]
configuration = ["cpus=8, sheng-smp=1, armcpu-spi-ipi=1 and armcpu-self-ipi=1; virtual timer INTID 19.", "CONFIG_XNU_ARMCPU, CONFIG_XNU_NATIVE_ARCH_TIMER and CONFIG_XNU_PICASSO_CPUFREQ; topology patch selects E/P clusters and AMP scheduling."]
procedure = ["Generate the ADT and inspect CPU affinities and timer/GIC properties.", "Boot with PSCI and routed SPI IPIs, then compare per-core entry and timer/IPI counters.", "For a deliberate OSM governor test, supply sheng-cpufreq=<stage> and measure frequency/load/thermal behavior."]
findings = ["The virtual timer is PPI 3, absolute INTID 19. This board routes cross-core IPIs through SPIs and uses a self-IPI to clear the new core's disabled-signal state.", "PR13's scheduler change places the default timeshare bucket on the E cluster while retaining P preference for higher-priority UI buckets; correct DTB topology alone does not establish balanced load."]
completion = ["All eight CPUs reach their running checkpoints, timer/IPI delivery works, and separately measured governor transitions stay within hardware limits."]
limits = ["The default command line does not enable the staged OSM governor. Sustained load, thermal control and sleep/resume remain separate validation."]
next_action = ["Capture per-core timers, IPIs and E/P utilization during interactive rendering."]
evidence = [{kind = "source", reference = "drivers/ArmCpu/ArmCpu.cpp", result = "CPU startup, interrupt routing and topology adaptation."}, {kind = "source", reference = "patches/picasso-cpu-topology-xnu.patch", result = "AMP/Edge scheduling policy for this two-cluster board."}, {kind = "source", reference = "drivers/NativeCpuFreq/CpuFreqProbe.cpp", result = "SM7250 OSM probe and staged governor."}]

[[area]]
id = "memory"
status = "implemented"
components = ["ArmSmmu4K"]
paths = ["scripts/make-picasso-adt.py", "kits/ArmSmmu4K/**", "drivers/NativeAdreno/NativeAdrenoMemory*", "drivers/NativeAdreno/NativeAdrenoVm*"]
inputs = ["6 GiB DRAM map, firmware reservations, the contiguous XNU window, 4 KiB pages, apps/GPU SMMU ownership and consumer DMA address widths."]
configuration = ["payload.dram_size = 0x180000000; payload.adt.owned_memory_size = 0x140000000; packed_data_ramdisk = true.", "GPU SMMU = 0x03da0000/0x10000; controller allocations and page-table mappings must use their qualified address/cache policy."]
procedure = ["Compare the firmware map with generated ADT ranges and reserved regions.", "Inspect DarwinBoot's actual window and XNU managed-page count; distinguish requested memory from granted memory.", "Validate buffer alignment, CPU/DMA addresses, SMMU mappings, synchronization and release ownership before submission."]
findings = ["Installed DRAM, the requested loader window and resident sparse Data pages are different quantities. Reserved framebuffer/firmware holes remain excluded.", "PR13's committed handoff reports about 4.95 GiB managed memory under its experimental FD/image. That result is conditional on those inputs, not a guarantee that every 5 GiB request is satisfied."]
completion = ["Handoff ranges and reservations do not overlap, the actual grant is propagated to XNU, and each active DMA consumer accesses only its owned mapped range."]
limits = ["Every claimed mapping needs the corresponding firmware and image identity. Memory pressure, cache coherency and all peripheral DMA consumers are not fully qualified."]
next_action = ["Measure managed/free/wired pages and DMA/SMMU faults during sustained UI use."]
evidence = [{kind = "source", reference = "scripts/make-picasso-adt.py", result = "DRAM, kernel-window request, reservations and device register ranges."}, {kind = "source", reference = "drivers/NativeAdreno/NativeAdrenoVm.cpp", result = "GPU mapping and address-space ownership implementation."}, {kind = "source", reference = "docs/handoff-20261103-gpu-render-next.md", result = "Historical PR13 memory measurements and their experimental-image conditions."}]

[[area]]
id = "storage"
status = "implemented"
components = ["ShengUfs", "VerifiedRoot", "VirtioMmioBlock", "RamBlock", "SoftwareAES"]
paths = ["drivers/NativeUfs/**", "drivers/NativeRamBlock/**", "policy/**", "scripts/*ufs*", "scripts/*root*", "scripts/*ram-data*", "scripts/*union*", "scripts/*verified*", "scripts/build-picasso-aes.py", "package/PicassoAes*"]
inputs = ["SM7250 UFS host 0x01d84000/0x3000, PHY 0x01d80000/0x2000, GCC clocks/resets and apps-SMMU stream; LUN0 userdata with 4096-byte sectors and measured capacity 0xbdebfb000 bytes.", "Owner-signed OS/SystemOS windows, root UUID, original trust inputs and a separately formatted sparse APFS Data seed."]
configuration = ["native-ufs-root=1, native-ufs-start-delay=5 and native-ufs-delay-yield=1; sheng-data-persist=2 requests the optional changed-page store.", "CONFIG_XNU_NATIVE_UFS, OWNER_ROOT_TRUST, OWNER_CACHE_MOUNT, OWNER_UNION_SYSTEMOS and OWNER_DATA_MOUNT; root UUID 04769D26-2CA0-4825-B443-E2E5F88300F2; current generated seed has 1024 MiB sparse logical capacity."]
procedure = ["Check host/PHY clock, reset, power and SMMU resources before link startup; validate SCSI capacity, GPT and known-block reads.", "Verify signed window identities and source hashes, then expose authenticated OS/SystemOS and mount the union root.", "Prepare the separate APFS Data seed and compare its generated UUID to the compiled configuration.", "For persistence qualification, write known data, reboot, read it back and verify overlay bounds and identity."]
findings = ["NativeUfs is the board's legacy implementation of the catalog's ShengUfs/block-root interfaces. VirtioMmioBlock is dependency lineage; CONFIG_XNU_NATIVE_VIRTIO_BLOCK remains disabled for this physical controller.", "SystemOS union lookup exposes standalone cryptex libraries on the process root; the dyld shared-cache directory alone is insufficient.", "Sparse logical Data capacity is not a contiguous allocation. Selecting overlay mode 2 does not establish successful mounting or reboot persistence."]
completion = ["Known blocks and volume identities match signed inputs, root mounts and launchd starts; persistent Data additionally passes write/reboot/readback."]
limits = ["The complete persistent Data path and prolonged write pressure require device testing. Userdata capacity does not establish an unmeasured GPT start LBA."]
next_action = ["Capture overlay mount status, free-space/page pressure and a bounded persistence readback."]
evidence = [{kind = "source", reference = "drivers/NativeUfs/NativeUfs.cpp", result = "Physical UFS transport and owned block-device publication."}, {kind = "source", reference = "scripts/prepare-picasso-ram-data.py", result = "Sparse seed creation, offline policy and generated UUID."}, {kind = "source", reference = "patches/unixnu-source-kernel.patch", result = "Signed root, SystemOS union and separate Data integration."}]

[[area]]
id = "display"
status = "implemented"
components = ["GopFramebuffer"]
paths = ["drivers/NativeMobileDisplay/**", "scripts/*display*", "scripts/*legacy*", "scripts/*gop*", "scripts/*framebuffer*"]
inputs = ["Firmware-owned GOP scanout, physical base/stride/size, BGRX8888 pixels, original IOMobileFramebufferLegacy/IOSurface ABI and optional GPU presenter client."]
configuration = ["CONFIG_XNU_NATIVE_LEGACY_DISPLAY; offline-legacy-gop=1, offline-legacy-validate=1, offline-legacy-transfer=1 and offline-legacy-cpu-present=1.", "sheng-vsync=60 sends software refresh notifications; sheng-fb-gpu=1 enables the GPU handoff offer; boot-progress=2 retains the boot monitor."]
procedure = ["Audit the original framebuffer classes, slots and swap structures against the pinned kernelcache.", "Validate GOP base, dimensions, stride and mappings, then present a known CPU frame before enabling the GPU handoff.", "Compare accepted/transferred/retired requests, presenter completions and CPU copy counters while exercising input."]
findings = ["The original family retains its ABI and receives completion/retirement from the board subclass. CPU fallback and GPU scanout are distinct paths.", "PR13's committed handoff reports P4/e0, growing GPU presents and CPU copies frozen at two warmup frames on wf145. These measurements use an external addon and experimental command line.", "The main implementation still has an optional early-retirement path; a successful handoff observation does not prove producer lifetime correctness under every workload."]
completion = ["Known frames have correct geometry/colors; interactive frames complete and retire without stalls or corruption; brightness/timing claims require separate panel measurements."]
limits = ["No native DPU/pageflip/vblank or brightness control is claimed. Software vsync cannot prove tear-free scanout. The iOS16-GPU branch's later ownership fix has not been imported by this documentation change."]
next_action = ["Qualify producer lifetime, cache policy and failed-import recovery on main while measuring interactive copy/retirement counters."]
