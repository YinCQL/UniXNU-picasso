configuration = ["CONFIG_XNU_SHENG_HIDINPUT and CONFIG_XNU_NOVATEK_TOUCH; offline-hid-input=1, offline-hid-home=1, sheng-touch-hid=1 and sheng-touch=4.", "Default synthetic input starts at 540 seconds with 16 swipes; experimental PR13 runs override attachment/start timing. Sensor coordinates cover 1080x2400."]
procedure = ["Fetch and verify the pinned touch firmware, compile the original HID ABI bindings and expose the digitizer/EventDriver sink.", "Start stage-4 GENI SPI sampling only after the sink is ready, parse contact IDs and map coordinates to the configured panel.", "Exercise press/move/release and multiple contacts; correlate successful reports with accepted UI actions."]
findings = ["The virtual source and physical sensor share the owned HID sink. Successful reports commit state; failed submissions retain the latest snapshot for retry.", "Original IOHIDEventDriver prelink avoids falling through to a unavailable DriverKit server. A probe-ready message or synthetic report count alone does not prove gesture acceptance."]
completion = ["Coordinates and stable contact IDs match the panel, all releases arrive and physical gestures trigger the expected UI changes."]
limits = ["Multitouch, buttons and long-run failure/recovery need separate device coverage; synthetic gestures do not replace physical input testing."]
